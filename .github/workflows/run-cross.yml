# Needs the corpus public: the runner of one private repository cannot read another.
name: run-cross
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  from-git:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # case: install-vcs-url
      - run: pip install "git+https://github.com/ClaudioMascaro/meada-smoke-lib@main"
      # case: program-of-another-repository
      - run: smoke-cli
