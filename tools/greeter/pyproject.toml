[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meada-smoke-greeter"
version = "0.1.0"
description = "Second console script of the Meada CI smoke corpus"
requires-python = ">=3.9"

[project.scripts]
smoke-greet = "smoke_greeter.main:run"

[tool.setuptools.packages.find]
where = ["src"]
